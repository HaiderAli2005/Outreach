substitutions:
  _REGION: europe-west1
  _REPO: aperture
  _API_SERVICE: aperture-api
  _WEB_SERVICE: aperture-web
  _API_ORIGIN: https://api.example.com
  _SQL_INSTANCE: project:region:instance
  _VPC_CONNECTOR: aperture-connector

steps:
  - id: api-image
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "infra/Dockerfile.api", "--target", "runtime", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA", "."]
  - id: migrate-image
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "infra/Dockerfile.api", "--target", "migrate", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api-migrate:$SHORT_SHA", "."]
  - id: web-image
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "infra/Dockerfile.web", "--build-arg", "API_ORIGIN=${_API_ORIGIN}", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA", "."]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api"]
  - id: push-migrate
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api-migrate"]
  - id: push-web
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web"]
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run jobs deploy aperture-migrate --region ${_REGION} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api-migrate:$SHORT_SHA \
          --set-cloudsql-instances ${_SQL_INSTANCE} \
          --set-secrets DATABASE_URL=DATABASE_URL:latest \
          --max-retries 0 --task-timeout 600 && \
        gcloud run jobs execute aperture-migrate --region ${_REGION} --wait
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy ${_API_SERVICE} --region ${_REGION} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA \
          --allow-unauthenticated --port 8080 --cpu 1 --memory 1Gi --min-instances 1 --max-instances 10 \
          --no-cpu-throttling --concurrency 80 --timeout 900 \
          --set-cloudsql-instances ${_SQL_INSTANCE} --vpc-connector ${_VPC_CONNECTOR} \
          --set-env-vars NODE_ENV=production,LOG_LEVEL=info \
          --set-secrets DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,WEB_ORIGIN=WEB_ORIGIN:latest,PUBLIC_API_URL=PUBLIC_API_URL:latest,JWT_ACCESS_SECRET=JWT_ACCESS_SECRET:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest,JOBS_SECRET=JOBS_SECRET:latest,WEBHOOK_SECRET=WEBHOOK_SECRET:latest,APPROVE_LINK_SECRET=APPROVE_LINK_SECRET:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_PUBLISHABLE_KEY=STRIPE_PUBLISHABLE_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,STRIPE_PRICE_LAUNCH=STRIPE_PRICE_LAUNCH:latest,STRIPE_PRICE_GROWTH=STRIPE_PRICE_GROWTH:latest,STRIPE_PRICE_SCALE=STRIPE_PRICE_SCALE:latest,STRIPE_PRICE_INBOX=STRIPE_PRICE_INBOX:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,GOOGLE_REDIRECT_URI=GOOGLE_REDIRECT_URI:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest
  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy ${_WEB_SERVICE} --region ${_REGION} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA \
          --allow-unauthenticated --port 8080 --cpu 1 --memory 512Mi --min-instances 0 --max-instances 10

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api-migrate:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA
options:
  logging: CLOUD_LOGGING_ONLY

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aperture
      POSTGRES_PASSWORD: aperture
      POSTGRES_DB: aperture
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aperture"]
      interval: 5s
      retries: 10
  postgres-test-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: aperture
    entrypoint: ["sh", "-c", "psql -h postgres -U aperture -tc \"SELECT 1 FROM pg_database WHERE datname='aperture_test'\" | grep -q 1 || psql -h postgres -U aperture -c 'CREATE DATABASE aperture_test'"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
